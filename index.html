<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AKAN NAME GENERATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>AKAN NAME GENERATOR</h1>

    <div class="container">
        <label for="day">Day:</label>
        <input type="number" id="day" min="1" max="31" required>

        <label for="month">Month:</label>
        <input type="number" id="month" min="1" max="12" required>

        <label for="year">Year:</label>
        <input type="number" id="year" min="1900" max="2100" required>

        <label for="gender">Gender:</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <button onclick="getAkanName()">Get Akan Name</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>`
